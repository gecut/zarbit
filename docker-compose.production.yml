name: zarbit

services:
  web:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/example/zarbit}-web:${IMAGE_TAG:-latest}
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    init: true

  migrate:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/example/zarbit}-server:${IMAGE_TAG:-latest}
    command: ["node", "/app/packages/db/node_modules/prisma/build/index.js", "migrate", "deploy", "--config", "/app/packages/db/prisma.config.ts"]
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/zarbit.db
      RUST_LOG: info
    volumes:
      - zarbit-data:/data
    restart: "no"
    init: true

  server:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/example/zarbit}-server:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/zarbit.db
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.example.com}
      TELEGRAM_SESSIONS_DIR: /sessions
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID:-}
      WEB_APP_URL: ${WEB_APP_URL:-}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:-}
      MAX_TELEGRAM_SESSIONS: ${MAX_TELEGRAM_SESSIONS:-20}
    volumes:
      - zarbit-data:/data
      - zarbit-telegram-sessions:/sessions
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true

  worker:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/example/zarbit}-worker:${IMAGE_TAG:-latest}
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/zarbit.db
      TELEGRAM_SESSIONS_DIR: /sessions
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID:-}
      QUOTE_SENDER_ID: ${QUOTE_SENDER_ID:-}
      MAX_TELEGRAM_SESSIONS: ${MAX_TELEGRAM_SESSIONS:-20}
    volumes:
      - zarbit-data:/data
      - zarbit-telegram-sessions:/sessions
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true

volumes:
  zarbit-data:
  zarbit-telegram-sessions:
