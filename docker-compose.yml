name: zarbit

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:3000
    init: true
    ports:
      - "3001:80"
    env_file:
      - path: apps/web/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: file:/data/local.db
      TELEGRAM_SESSIONS_DIR: /sessions
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - type: bind
        source: ./.data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./.session
        target: /sessions
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    init: true
    env_file:
      - path: apps/worker/.env
        required: false
    environment:
      DATABASE_URL: file:/data/local.db
      RUST_LOG: info
      TELEGRAM_SESSIONS_DIR: /sessions
    volumes:
      - type: bind
        source: ./.data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./.session
        target: /sessions
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "/app/packages/db/node_modules/prisma/build/index.js", "migrate", "deploy", "--config", "/app/packages/db/prisma.config.ts"]
    environment:
      DATABASE_URL: file:/data/local.db
    volumes:
      - type: bind
        source: ./.data
        target: /data
        bind:
          create_host_path: false
    restart: "no"
