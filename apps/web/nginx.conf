server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never let SPA fallback expose dotfiles or VCS/configuration paths.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    # This is a static frontend; server-side script requests must not fall
    # through to index.html with a misleading 200 response.
    location ~* \.(?:php|phar|phtml|cgi|pl|py|jsp|asp|aspx)$ {
        return 404;
    }

    # SPA fallback
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
