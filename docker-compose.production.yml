name: zarbit

x-log-options: &log-options
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/gecut/zarbit}-web:${IMAGE_TAG:?Set an immutable IMAGE_TAG}
    expose: ["80"]
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    init: true
    logging: *log-options
    networks: [dokploy-network]

  migrate:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/gecut/zarbit}-server:${IMAGE_TAG:?Set an immutable IMAGE_TAG}
    user: "0:0"
    command: ["node", "/app/deploy/migrate.mjs"]
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
    volumes:
      - zarbit-telegram-sessions-postgres:/sessions
    restart: "no"
    init: true
    logging: *log-options
    networks: [dokploy-network]

  server:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/gecut/zarbit}-server:${IMAGE_TAG:?Set an immutable IMAGE_TAG}
    expose: ["3000"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      WEB_APP_URL: ${WEB_APP_URL:?Set WEB_APP_URL}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:?Set ALLOWED_TELEGRAM_USER_IDS}
      WORKER_INTERNAL_URL: http://worker:3002
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:?Set a random token of at least 32 characters}
    networks: [backend, dokploy-network]
    depends_on:
      migrate: { condition: service_completed_successfully }
      worker: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    logging: *log-options

  worker:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/gecut/zarbit}-worker:${IMAGE_TAG:?Set an immutable IMAGE_TAG}
    environment:
      NODE_ENV: production
      RELEASE_ID: ${IMAGE_TAG:?Set an immutable IMAGE_TAG}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-info}
      NODE_OPTIONS: --enable-source-maps
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      TELEGRAM_SESSIONS_DIR: /sessions
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH}
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID:?Set TELEGRAM_GROUP_ID}
      QUOTE_SENDER_ID: ${QUOTE_SENDER_ID:?Set QUOTE_SENDER_ID}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:?Set ALLOWED_TELEGRAM_USER_IDS}
      MAX_TELEGRAM_SESSIONS: ${MAX_TELEGRAM_SESSIONS:-20}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:?Set a random token of at least 32 characters}
    volumes:
      - zarbit-telegram-sessions-postgres:/sessions
    # `backend` protects worker RPC; Dokploy network provides DB and Telegram egress.
    networks: [backend, dokploy-network]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    logging: *log-options

networks:
  backend:
    internal: true
  dokploy-network:
    external: true

volumes:
  zarbit-telegram-sessions-postgres:
