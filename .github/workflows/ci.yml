name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HUSKY: "0"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zarbit?schema=public
  MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zarbit?schema=public
  VITE_SERVER_URL: https://api.example.com

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zarbit
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d zarbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint workspace
        run: pnpm run lint

      - name: Apply PostgreSQL baseline
        run: pnpm --filter @zarbit/db exec prisma migrate deploy

      - name: Verify PostgreSQL migration state
        run: pnpm --filter @zarbit/db exec prisma migrate status

      - name: Test workspace
        run: pnpm run test

      - name: Typecheck workspace
        run: pnpm run check-types

      - name: Build workspace
        run: pnpm run build
