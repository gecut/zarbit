# Local Docker validation uses the same topology as production.
# Use HTTPS test domains for the production Vite artifact.
services:
  web:
    extends: { file: docker-compose.production.yml, service: web }
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:?Set the public HTTPS API URL}
    ports: ["3001:80"]
  server:
    extends: { file: docker-compose.production.yml, service: server }
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports: ["3000:3000"]
  worker:
    extends: { file: docker-compose.production.yml, service: worker }
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
  migrate:
    extends: { file: docker-compose.production.yml, service: migrate }
    build:
      context: .
      dockerfile: apps/server/Dockerfile

networks:
  default: {}
  backend: {}
volumes:
  zarbit-data:
  zarbit-telegram-sessions:
