name: zarbit

services:
  web:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/example/zarbit}-web:${IMAGE_TAG:-latest}
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.zarbit-web.rule=Host(`${WEB_DOMAIN:-app.example.com}`)
      - traefik.http.routers.zarbit-web.entrypoints=websecure
      - traefik.http.routers.zarbit-web.tls=true
      - traefik.http.routers.zarbit-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.zarbit-web.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    init: true

  server:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/example/zarbit}-server:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    env_file:
      - path: ./deploy/server.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/zarbit.db
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.example.com}
    volumes:
      - zarbit-data:/data
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.zarbit-api.rule=Host(`${API_DOMAIN:-api.example.com}`)
      - traefik.http.routers.zarbit-api.entrypoints=websecure
      - traefik.http.routers.zarbit-api.tls=true
      - traefik.http.routers.zarbit-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.zarbit-api.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true

  worker:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/example/zarbit}-worker:${IMAGE_TAG:-latest}
    env_file:
      - path: ./deploy/worker.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/zarbit.db
      TELEGRAM_SESSION_PATH: /session/zarbit.session
    volumes:
      - zarbit-data:/data
      - zarbit-worker-session:/session
    networks:
      - dokploy-network
    restart: unless-stopped
    init: true

volumes:
  zarbit-data:
  zarbit-worker-session:

networks:
  dokploy-network:
    external: true
